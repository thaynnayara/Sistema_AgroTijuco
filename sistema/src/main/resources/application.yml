spring:
  application:
    name: agrotijuco-sistema

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agrotijuco_db}
    username: ${SPRING_DATASOURCE_USERNAME:agrotijuco}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      leak-detection-threshold: 5000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        tenant_identifier_resolver: com.agrotijuco.sistema.config.tenant.HeaderTenantIdentifierResolver

jwt:
  secret: ${JWT_SECRET:AgroTijucoSuperSecretKeyForJWTTokenGeneration2026SaaSPlatformRequiredAtLeast256BitsLong}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: ${PORT:8080}
  shutdown: graceful
